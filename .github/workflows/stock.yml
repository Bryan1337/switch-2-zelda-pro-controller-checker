name: Zelda stock check
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: zelda-stock
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-
      - run: npm test
      - run: npm run check
        env:
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ github.run_id }}
          path: results/
          retention-days: 3
