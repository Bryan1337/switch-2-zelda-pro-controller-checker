name: Zelda stock check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/stock.yml']
permissions:
  contents: write
concurrency:
  group: zelda-stock
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-
      - run: npm test
      - run: node browser-test.mjs
      - run: npm run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ github.run_id }}
          path: results/
          retention-days: 3
      - name: Save initial validation report
        if: always() && github.event_name == 'push' && hashFiles('results/report.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp results/report.json validation-report.json
          if [ -f results/discord.json ]; then cp results/discord.json discord-validation.json; git add discord-validation.json; fi
          git add validation-report.json
          git commit -m "Record hosted stock validation" || exit 0
          git push
